spring.application.name=gateway
server.port=8080

# JWT
jwt.secret=${JWT_SECRET:mySecretKeymySecretKeymySecretKeymySecretKeymySecretKeymySecretKey}

# Downstream service URLs
services.auth.url=${SERVICES_AUTH_URL:http://localhost:8081}
services.order.url=${SERVICES_ORDER_URL:http://localhost:8082}
services.product.url=${SERVICES_PRODUCT_URL:http://localhost:8083}
services.message.url=${SERVICES_MESSAGE_URL:http://localhost:8084}

# CORS
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}
cors.allowed-methods=${CORS_ALLOWED_METHODS:GET,POST,PUT,DELETE,OPTIONS}
cors.max-age=${CORS_MAX_AGE:3600}

spring.cloud.gateway.enabled=true
