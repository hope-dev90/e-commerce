spring.application.name=gateway
server.port=8080

# JWT
jwt.secret=mySecretKeymySecretKeymySecretKeymySecretKeymySecretKeymySecretKey

# Downstream service URLs
services.auth.url=http://localhost:8081
services.order.url=http://localhost:8082
services.product.url=http://localhost:8083
services.message.url=http://localhost:8084

# CORS
cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500
cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
cors.max-age=3600

# Spring Cloud Gateway
spring.cloud.gateway.enabled=true
