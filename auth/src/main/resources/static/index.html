<!DOCTYPE html>
<html>
<head>
    <title>Auth System</title>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 40px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            background: white;
            padding: 30px;
            width: 450px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }

        h2 {
            color: #333;
            text-align: center;
            margin-bottom: 10px;
        }

        h3 {
            color: #555;
            margin-top: 25px;
            margin-bottom: 15px;
            font-size: 18px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .result-box {
            background: #f8f9fa;
            padding: 15px;
            margin-top: 20px;
            border-radius: 8px;
            border-left: 4px solid #667eea;
        }

        .success {
            background: #d4edda;
            border-left-color: #28a745;
            color: #155724;
        }

        .error {
            background: #f8d7da;
            border-left-color: #dc3545;
            color: #721c24;
        }

        pre {
            background: #f4f4f4;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            overflow-x: auto;
            font-size: 12px;
        }

        .token-display {
            background: #fff3cd;
            padding: 10px;
            margin-top: 10px;
            border-radius: 5px;
            border: 1px solid #ffc107;
            word-break: break-all;
            font-size: 11px;
        }

        hr {
            border: none;
            border-top: 1px solid #e0e0e0;
            margin: 30px 0;
        }
    </style>

</head>

<body>

<div class="container">
    <h2>🔐 Authentication System</h2>

    <h3>📝 Register</h3>

    <input id="username" placeholder="Full Name">

    <input id="email" placeholder="Email Address" type="email">

    <input id="password" placeholder="Password" type="password">

    <button onclick="register()">
        Create Account
    </button>

    <hr>

    <h3>🔑 Login</h3>

    <input id="loginEmail" placeholder="Email Address" type="email">

    <input id="loginPassword" placeholder="Password" type="password">

    <button onclick="login()">
        Sign In
    </button>

    <div id="result" class="result-box" style="display: none;"></div>
</div>

<script>

    const API_URL = "http://localhost:8080/auth";

    function showResult(message, isSuccess, data = null) {
        const resultDiv = document.getElementById("result");
        resultDiv.style.display = "block";

        if (isSuccess) {
            resultDiv.className = "result-box success";
            let html = `<strong>✅ ${message}</strong>`;

            if (data) {
                if (data.token) {
                    html += `<div class="token-display"><strong>🔑 Your JWT Token:</strong><br>${data.token}</div>`;
                }
                if (data.user) {
                    html += `<pre>${JSON.stringify(data.user, null, 2)}</pre>`;
                }
            }
            resultDiv.innerHTML = html;
        } else {
            resultDiv.className = "result-box error";
            resultDiv.innerHTML = `<strong>❌ ${message}</strong>`;
        }
    }

    async function register() {
        const username = document.getElementById("username").value;
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;

        if (!username || !email || !password) {
            showResult("Please fill in all fields", false);
            return;
        }

        const data = {
            username: username,
            email: email,
            password: password
        };

        try {
            const response = await fetch(
                `${API_URL}/register`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }
            );

            const result = await response.json();

            if (response.ok) {
                showResult(result.message, true, result.data);
                // Clear form
                document.getElementById("username").value = "";
                document.getElementById("email").value = "";
                document.getElementById("password").value = "";
            } else {
                showResult(result.message || "Registration failed", false);
            }
        } catch (error) {
            showResult("Error: " + error.message, false);
        }
    }

    async function login() {
        const email = document.getElementById("loginEmail").value;
        const password = document.getElementById("loginPassword").value;

        if (!email || !password) {
            showResult("Please enter email and password", false);
            return;
        }

        const data = {
            email: email,
            password: password
        };

        try {
            const response = await fetch(
                `${API_URL}/login`,
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(data)
                }
            );

            const result = await response.json();

            if (response.ok) {
                showResult(result.message, true, result.data);
                // Clear form
                document.getElementById("loginEmail").value = "";
                document.getElementById("loginPassword").value = "";
            } else {
                showResult(result.message || "Login failed", false);
            }
        } catch (error) {
            showResult("Error: " + error.message, false);
        }
    }
</script>

</body>
</html>
